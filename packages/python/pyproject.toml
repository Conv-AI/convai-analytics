[project]
name = "convai-analytics"
version = "0.2.0"
description = "Python SDK for the Convai analytics API. Designed for notebooks, scripts, and coding-agent workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Convai", email = "eng@convai.com" }]
license = { text = "Proprietary" }

dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.9,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.34",
    "ruff>=0.8",
    "mypy>=1.13",
    "datamodel-code-generator>=0.56.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["convai_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "N", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["convai_analytics"]
